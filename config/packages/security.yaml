security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory: { memory: null }
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Rôles historiques conservés (ROLE_OPERATOR, ROLE_ADMIN) ; rôles ajoutés :
    # - ROLE_STAFF            : socle commun à tout le personnel interne (accès aux écrans de suivi) ;
    # - ROLE_MISSION_OPERATOR : requêtes citoyennes, création et gestion des missions ;
    # - ROLE_HERO_OPERATOR    : roster, Squad Builder, déploiement, suivi des héros.
    # ROLE_OPERATOR (opérateur polyvalent historique) garde exactement ses droits antérieurs.
    # - ROLE_CITOYEN          : compte citoyen, limité à l'espace /citoyen (signalement et sa
    #                           confirmation) ; il n'hérite d'aucun rôle du personnel.
    role_hierarchy:
        ROLE_CITOYEN: ROLE_USER
        ROLE_STAFF: ROLE_USER
        ROLE_MISSION_OPERATOR: ROLE_STAFF
        ROLE_HERO_OPERATOR: ROLE_STAFF
        ROLE_OPERATOR: [ROLE_USER, ROLE_STAFF, ROLE_HERO_OPERATOR]
        ROLE_ADMIN: [ROLE_OPERATOR, ROLE_MISSION_OPERATOR, ROLE_HERO_OPERATOR]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_tactical_center
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        # La déconnexion doit rester possible pour tout compte (citoyen compris) : sans cette
        # règle, « ^/ » (ROLE_STAFF) refuserait /logout avant que le pare-feu ne le traite.
        - { path: ^/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/demande-intervention, roles: PUBLIC_ACCESS }
        - { path: ^/citoyen, roles: ROLE_CITOYEN }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_STAFF }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
